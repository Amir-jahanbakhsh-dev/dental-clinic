<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود مدیر</title>
  <link rel="stylesheet" href="./public/styles/auth-styles.css">
</head>
<body class="admin-login-page">
  <div class="auth-container admin-login">
    <div class="auth-box">
      <div class="auth-header">
        <div class="logo">🦷</div>
        <h1>ورود مدیر سیستم</h1>
        <p>لطفاً اطلاعات مدیر سیستم را وارد کنید.</p>
      </div>
      <form class="auth-form">
        <div class="form-group">
          <label for="admin-username">نام کاربری مدیر</label>
          <input type="text" id="admin-username" placeholder="نام کاربری مدیر">
        </div>
        <div class="form-group">
          <label for="admin-password">رمز عبور مدیر</label>
          <input type="password" id="admin-password" placeholder="رمز عبور مدیر">
        </div>
        <button type="submit" class="submit-btn">ورود به پنل</button>
      </form>
    </div>
  </div>
  <script src="./public/js/auth-validation.js"></script>
</body>

</html>
