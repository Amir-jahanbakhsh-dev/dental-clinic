<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود کاربر</title>
  <link rel="stylesheet" href="./public/styles/auth-styles.css">
</head>
<body class="user-login-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>ورود به حساب کاربری</h1>
        <p>برای ورود، نام کاربری و رمز عبور خود را وارد کنید.</p>
      </div>
      <form class="auth-form">
        <div class="form-group">
          <label for="username">نام کاربری</label>
          <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید">
        </div>
        <div class="form-group">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
        </div>
        <button type="submit" class="submit-btn">ورود</button>
        <div class="auth-footer">
          حساب کاربری ندارید؟ <a href="usersSignup.html">ثبت نام کنید</a>
        </div>
      </form>
    </div>
  </div>
  <script src="./public/js/auth-validation.js"></script>
</body>
</html>
